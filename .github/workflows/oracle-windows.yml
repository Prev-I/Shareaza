name: Oracle on Windows

# Runs the Windows test kit in docs/oracle-windows/ end to end, as its README
# tells a person to: install a client, prepare it for one cache, start it, watch
# it, close it, prepare it again as a hub, run it again, then collect and restore.
# The cache is a local stub, so nothing here reaches the live G2 network. A fake
# "own setup" is planted before installing, so the backup and restore are checked
# too: its private torrent folder must never be shared and must come back.

on:
    workflow_dispatch:
      inputs:
        release_tag:
          description: 'Published release tag for the fork installer'
          required: false
          default: 'v2.7.11.2-previ.7'
        build_run:
          description: 'ID of a release.yml run whose x64 installer to test instead of a release (an unpublished build)'
          required: false
          default: ''
    pull_request:
      paths:
        - docs/oracle-windows/**
        - .github/workflows/oracle-windows.yml

permissions:
    contents: read
    # gh run download, for the build_run input.
    actions: read

jobs:
    oracle:
        runs-on: windows-2022
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                include:
                  - client: Official
                    expect: client=RAZA2.7.10.2&
                    agent: Shareaza 2.7.10.2
                  # {version} is the installed Shareaza.exe's version, so the same check
                  # serves every fork release and unpublished build.
                  - client: Fork
                    expect: client=RAZI{version}&
                    agent: iShareaza {version}
        defaults:
            run:
                # Windows PowerShell 5.1, the version on Windows 10.
                shell: powershell
        env:
            KIT: docs\oracle-windows
        steps:
        -   name: Set the work folder
            # The README's default; it must be on the same drive as %APPDATA%.
            run: Add-Content -Path $env:GITHUB_ENV -Value "WORK=$env:USERPROFILE\ShareazaOracle"

        -   name: Checkout the kit
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
                sparse-checkout: docs
                persist-credentials: false

        -   name: Plant a fake own setup before installing
            run: |
                $ErrorActionPreference = 'Stop'
                $k = 'HKCU:\Software\Shareaza\Shareaza'
                New-Item -Path "$k\Downloads" -Force | Out-Null
                New-Item -Path "$k\Connection" -Force | Out-Null
                New-ItemProperty -Path $k -Name OracleMarker -Value 'mine' -PropertyType String -Force | Out-Null
                # A private folder of the user's own, which the oracle must not share.
                $private = "$env:USERPROFILE\MyTorrents"
                New-Item -ItemType Directory -Force $private | Out-Null
                Set-Content "$private\secret.torrent" 'private'
                New-ItemProperty -Path "$k\Downloads" -Name TorrentPath -Value $private -PropertyType String -Force | Out-Null
                New-ItemProperty -Path "$k\Connection" -Name RandomPort -Value 1 -PropertyType DWord -Force | Out-Null
                New-Item -ItemType Directory -Force -Path "$env:APPDATA\Shareaza\Data" | Out-Null
                Set-Content -Path "$env:APPDATA\Shareaza\Data\marker.txt" -Value 'mine'
                # The fork's earlier installers made a TCP and UDP pair "Shareaza" through the old
                # firewall API, for the profile active at install time. Plant it the same way, so the
                # firewall check after installing shows the new installer replaces it.
                if ('${{ matrix.client }}' -eq 'Fork') {
                    $exe = Join-Path $env:ProgramFiles 'Shareaza\Shareaza.exe'
                    # The old installer ran this after copying its files, and the old API needs the program's folder
                    # to exist: an empty placeholder stands in, and goes before installing.
                    $dir = Split-Path $exe
                    $madeDir = -not (Test-Path $dir)
                    New-Item -ItemType Directory -Force $dir | Out-Null
                    New-Item -ItemType File -Force $exe | Out-Null
                    $legacy = New-Object -ComObject HNetCfg.FwAuthorizedApplication
                    $legacy.ProcessImageFileName = $exe
                    $legacy.Name = 'Shareaza'
                    $legacy.Scope = 0       # NET_FW_SCOPE_ALL
                    $legacy.IpVersion = 2   # NET_FW_IP_VERSION_ANY
                    $legacy.Enabled = $true
                    (New-Object -ComObject HNetCfg.FwMgr).LocalPolicy.CurrentProfile.AuthorizedApplications.Add($legacy)
                    Remove-Item -LiteralPath $exe
                    if ($madeDir) { Remove-Item -LiteralPath $dir }
                    $planted = @(Get-NetFirewallRule -DisplayName 'Shareaza' -ErrorAction SilentlyContinue |
                        Where-Object { ($_ | Get-NetFirewallApplicationFilter).Program -eq $exe })
                    $planted | ForEach-Object { "legacy firewall rule: $($_.Direction) $($_.Action), profiles $($_.Profile), protocol $(($_ | Get-NetFirewallPortFilter).Protocol)" }
                    if (-not $planted) { throw 'the legacy firewall rule pair was not created' }
                }

        -   name: Fetch an unpublished build
            if: inputs.build_run != '' && matrix.client == 'Fork'
            env:
                GH_TOKEN: ${{ github.token }}
                BUILD_RUN: ${{ inputs.build_run }}
            run: |
                $ErrorActionPreference = 'Stop'
                if ($env:BUILD_RUN -notmatch '^[0-9]+$') { throw "build_run must be a run ID, not '$env:BUILD_RUN'" }
                & gh run download $env:BUILD_RUN -R $env:GITHUB_REPOSITORY -n 'Shareaza Windows x64 Release' -D build
                if ($LASTEXITCODE -ne 0) { throw "could not download the x64 installer of run $env:BUILD_RUN" }
                Get-ChildItem build | ForEach-Object { "build: $($_.Name)" }

        -   name: Install the client with the kit
            env:
                TAG: ${{ inputs.release_tag || 'v2.7.11.2-previ.7' }}
            run: |
                $ErrorActionPreference = 'Stop'
                if (Test-Path build) {
                    & "$env:KIT\Install-Shareaza.ps1" -Client ${{ matrix.client }} -InstallerDir build -WorkDir $env:WORK
                } else {
                    & "$env:KIT\Install-Shareaza.ps1" -Client ${{ matrix.client }} -ReleaseTag $env:TAG -WorkDir $env:WORK
                }
                if (-not (Test-Path "$env:WORK\session\manifest.json")) { throw 'no sealed backup after installing' }
                $app = (Get-ItemProperty 'HKCU:\Software\Shareaza\Shareaza').Path
                (Get-FileHash "$app\Data\DefaultServices.dat").Hash | Set-Content stock-defaults.sha256
                # The version the client reports, as CShareazaApp builds it from the file version.
                $vi = (Get-Item "$app\Shareaza.exe").VersionInfo
                $version = '{0}.{1}.{2}.{3}' -f $vi.FileMajorPart, $vi.FileMinorPart, $vi.FileBuildPart, $vi.FilePrivatePart
                "installed version $version"
                Add-Content -Path $env:GITHUB_ENV -Value "CLIENT_VERSION=$version"
                # Builds that know Connection.EnableIPv6 (2.7.11.0-previ.5 on) get the IPv6 and
                # BugSplat checks; the official client and earlier fork releases do not.
                $bytes = [IO.File]::ReadAllBytes("$app\Shareaza.exe")
                $text = [Text.Encoding]::GetEncoding(28591).GetString($bytes)
                # A release build has no alpha warning (Shareaza.cpp, #if ! RELEASE_BUILD). Checked for
                # unpublished builds and for releases from 2.7.11.2 on, the first built as releases.
                if ((Test-Path build) -or ([version]$version -ge [version]'2.7.11.2')) {
                    $alpha = [Text.Encoding]::GetEncoding(28591).GetString([Text.Encoding]::Unicode.GetBytes('ALPHA TEST version'))
                    if ($text.Contains($alpha)) { throw "Shareaza.exe $version is an alpha build: it contains the alpha-test warning" }
                    'release build: no alpha-test warning'
                }
                # The installer's Windows Firewall rule, for the fork from 2.7.11.2 on: one inbound
                # rule "Shareaza" for Shareaza.exe, on Private and Domain networks, never Public.
                @'
                param([string] $Program, [switch] $Absent)
                $ErrorActionPreference = 'Stop'
                # -DisplayName and -Direction belong to different parameter sets: filter the direction here.
                $rules = @(Get-NetFirewallRule -DisplayName 'Shareaza' -ErrorAction SilentlyContinue |
                    Where-Object { "$($_.Direction)" -eq 'Inbound' -and ($_ | Get-NetFirewallApplicationFilter).Program -eq $Program })
                $rules | ForEach-Object { "rule '$($_.DisplayName)': $($_.Action), enabled $($_.Enabled), profiles $($_.Profile), edge $($_.EdgeTraversalPolicy), protocol $(($_ | Get-NetFirewallPortFilter).Protocol)" }
                if ($Absent) {
                    if ($rules) { throw "$($rules.Count) firewall rule(s) 'Shareaza' for $Program remain" }
                    "no firewall rule 'Shareaza' for $Program"
                    return
                }
                if ($rules.Count -ne 1) { throw "expected one inbound firewall rule 'Shareaza' for $Program, found $($rules.Count)" }
                $r = $rules[0]
                if ("$($r.Action)" -ne 'Allow') { throw "the firewall rule does not allow: $($r.Action)" }
                if ("$($r.Enabled)" -ne 'True') { throw 'the firewall rule is disabled' }
                if ([int]$r.Profile -ne 3) { throw "the firewall rule is for profiles $($r.Profile), not Domain and Private only" }
                if ("$(($r | Get-NetFirewallPortFilter).Protocol)" -ne 'Any') { throw 'the firewall rule is not for any protocol' }
                'one firewall rule: inbound, allow, Domain and Private'
                '@ | Set-Content -Encoding ASCII check-firewall.ps1
                if ('${{ matrix.client }}' -eq 'Fork' -and ((Test-Path build) -or ([version]$version -ge [version]'2.7.11.2'))) {
                    Add-Content -Path $env:GITHUB_ENV -Value 'FIREWALL_RULE=1'
                    .\check-firewall.ps1 -Program "$app\Shareaza.exe"
                }
                $needle = [Text.Encoding]::GetEncoding(28591).GetString([Text.Encoding]::Unicode.GetBytes('EnableIPv6'))
                if ($text.Contains($needle)) {
                    Add-Content -Path $env:GITHUB_ENV -Value 'HAS_IPV6_SETTING=1'
                    $left = @(Get-ChildItem -Path "$app\BugSplat*", "$app\BsSndRpt*" -ErrorAction SilentlyContinue)
                    if ($left) { throw "BugSplat files are installed: $($left.Name -join ', ')" }
                    'no BugSplat files installed'
                } else {
                    Add-Content -Path $env:GITHUB_ENV -Value 'HAS_IPV6_SETTING=0'
                    '::notice::this build has no Connection.EnableIPv6 setting: the IPv6 and BugSplat checks are skipped'
                }

        -   name: Start a stub cache
            run: |
                $ErrorActionPreference = 'Stop'
                @'
                import http.server, json, time
                class H(http.server.BaseHTTPRequestHandler):
                    def do_GET(self):
                        with open('gwc-requests.jsonl', 'a') as f:
                            f.write(json.dumps({'t': time.time(), 'path': self.path,
                                                'user_agent': self.headers.get('User-Agent')}) + '\n')
                        body = b'I|pong|oracle-stub 0.1|gnutella2\n'
                        self.send_response(200)
                        self.send_header('Content-Type', 'text/plain')
                        self.send_header('Content-Length', str(len(body)))
                        self.end_headers()
                        self.wfile.write(body)
                    def log_message(self, *a):
                        pass
                http.server.ThreadingHTTPServer(('127.0.0.1', 8080), H).serve_forever()
                '@ | Set-Content -Encoding ASCII stub.py
                Start-Process -FilePath python -ArgumentList '-I', 'stub.py' -WindowStyle Hidden
                $ok = $false
                foreach ($i in 1..20) {
                    try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/ready | Out-Null; $ok = $true; break } catch { Start-Sleep -Milliseconds 500 }
                }
                if (-not $ok) { throw 'the stub cache did not start' }
                Remove-Item gwc-requests.jsonl   # the readiness probe is not a client request
                # A helper the run steps share: start Shareaza, wait for a query, watch, close it cleanly.
                @'
                param([string] $Name, [switch] $ExpectIPv6, [switch] $Resize, [switch] $ExpectRTL)
                $ErrorActionPreference = 'Stop'
                $before = if (Test-Path gwc-requests.jsonl) { @(Get-Content gwc-requests.jsonl).Count } else { 0 }
                $app = (Get-ItemProperty 'HKCU:\Software\Shareaza\Shareaza').Path
                # As the README does: through Explorer, so Shareaza runs unelevated.
                Start-Process -FilePath explorer.exe -ArgumentList "`"$app\Shareaza.exe`""
                foreach ($i in 1..15) { if (Get-Process -Name Shareaza -ErrorAction SilentlyContinue) { break }; Start-Sleep 2 }
                if (Get-Process -Name Shareaza -ErrorAction SilentlyContinue) {
                    'started through explorer.exe'
                } else {
                    '::warning::explorer.exe did not start Shareaza on this runner; starting it directly, elevated'
                    Start-Process -FilePath "$app\Shareaza.exe" -WorkingDirectory $app
                }
                foreach ($i in 1..36) { if ((Test-Path gwc-requests.jsonl) -and @(Get-Content gwc-requests.jsonl).Count -gt $before) { break }; Start-Sleep 5 }
                & "$env:KIT\Watch-Oracle.ps1" -CacheUrl 'http://127.0.0.1:8080/gwc/' -Hours 0.015 -StatsEveryMinutes 1 -WorkDir $env:WORK
                # While running: nothing visible in the shared folders.
                $files = @(Get-ChildItem -File -Recurse "$env:WORK\shared" -ErrorAction SilentlyContinue)
                $files | ForEach-Object { "shared: $($_.FullName)" }
                if ($files) { throw "files appeared in the shared folders: $($files.Name -join ', ')" }
                $p = Get-Process -Name Shareaza -ErrorAction SilentlyContinue
                if (-not $p) { throw 'Shareaza was not running' }
                # Which addresses the client's sockets use, for builds with the IPv6 setting.
                if ($env:HAS_IPV6_SETTING -eq '1') {
                    $tcp = @(Get-NetTCPConnection -State Listen -OwningProcess $p.Id -ErrorAction SilentlyContinue)
                    $udp = @(Get-NetUDPEndpoint -OwningProcess $p.Id -ErrorAction SilentlyContinue)
                    $tcp | ForEach-Object { "tcp listen: $($_.LocalAddress) port $($_.LocalPort)" }
                    $udp | ForEach-Object { "udp: $($_.LocalAddress) port $($_.LocalPort)" }
                    if ($ExpectIPv6) {
                        if (-not ($tcp | Where-Object { $_.LocalAddress -eq '::' })) { throw 'IPv6 is on, but no TCP socket listens on ::' }
                        if (-not ($udp | Where-Object { $_.LocalAddress -eq '::' })) { throw 'IPv6 is on, but no UDP socket is bound to ::' }
                        'IPv6 on: TCP and UDP sockets on ::'
                    } else {
                        # Every TCP connection of the client, in any state, not only listeners:
                        # an outgoing IPv6 connection must not slip past. IPv4 and loopback
                        # addresses contain no colon.
                        $all = @(Get-NetTCPConnection -OwningProcess $p.Id -ErrorAction SilentlyContinue)
                        $v6 = @(@($all) + @($udp) | Where-Object { $_.LocalAddress -match ':' -or ($_.PSObject.Properties['RemoteAddress'] -and $_.RemoteAddress -match ':' -and $_.RemoteAddress -ne '::') })
                        if ($v6) { throw "IPv6 is off, but these sockets use IPv6: $(($v6 | ForEach-Object { $r = if ($_.PSObject.Properties['RemoteAddress']) { " to $($_.RemoteAddress) port $($_.RemotePort)" } else { '' }; "$($_.LocalAddress) port $($_.LocalPort)$r" }) -join ', ')" }
                        "IPv6 off: no IPv6 socket among $($all.Count) TCP connections and $($udp.Count) UDP endpoints"
                    }
                }
                "window: handle=$($p.MainWindowHandle) title='$($p.MainWindowTitle)' session=$($p.SessionId)"
                Add-Type -AssemblyName System.Windows.Forms, System.Drawing
                $b = [Windows.Forms.SystemInformation]::VirtualScreen
                # Shareaza's hidden 'Shareaza Remote' window is what MainWindowHandle may report, so find
                # the largest visible window of the process. The monitor bar must follow the window:
                # shrink it, then widen it, and take the screenshot after widening.
                if ($Resize -or $ExpectRTL) {
                    Add-Type -TypeDefinition (@(
                        'using System;',
                        'using System.Runtime.InteropServices;',
                        'public static class OracleWin {',
                        '    delegate bool EnumProc(IntPtr h, IntPtr l);',
                        '    [StructLayout(LayoutKind.Sequential)] public struct RECT { public int Left, Top, Right, Bottom; }',
                        '    [DllImport("user32.dll")] static extern bool EnumWindows(EnumProc p, IntPtr l);',
                        '    [DllImport("user32.dll")] static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);',
                        '    [DllImport("user32.dll")] static extern bool IsWindowVisible(IntPtr h);',
                        '    [DllImport("user32.dll")] public static extern int GetWindowLong(IntPtr h, int index);',
                        '    [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);',
                        '    [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr h, int cmd);',
                        '    [DllImport("user32.dll")] public static extern bool SetWindowPos(IntPtr h, IntPtr after, int x, int y, int cx, int cy, uint flags);',
                        '    public static IntPtr Largest(uint pid) {',
                        '        IntPtr best = IntPtr.Zero; long area = 0;',
                        '        EnumWindows(delegate(IntPtr h, IntPtr l) {',
                        '            uint owner; GetWindowThreadProcessId(h, out owner);',
                        '            RECT r;',
                        '            if (owner == pid && IsWindowVisible(h) && GetWindowRect(h, out r)) {',
                        '                long a = (long)(r.Right - r.Left) * (r.Bottom - r.Top);',
                        '                if (a > area) { area = a; best = h; }',
                        '            }',
                        '            return true;',
                        '        }, IntPtr.Zero);',
                        '        return best;',
                        '    }',
                        '}') -join "`n")
                    $h = [OracleWin]::Largest([uint32]$p.Id)
                    if ($h -eq [IntPtr]::Zero) { throw 'no visible window of Shareaza' }
                    # WS_EX_LAYOUTRTL (0x00400000) on the main window: the setting must have taken effect,
                    # or its absence in the other runs, or the screenshot shows nothing of the right-to-left layout.
                    $rtl = ([OracleWin]::GetWindowLong($h, -20) -band 0x00400000) -ne 0
                    "main window $h : right-to-left layout $rtl"
                    if ($ExpectRTL -and -not $rtl) { throw 'LanguageRTL is set, but the main window has no right-to-left layout' }
                    if (-not $ExpectRTL -and $rtl) { throw 'the main window has a right-to-left layout, but this run is left-to-right' }
                }
                if ($Resize) {
                    $wide = [Math]::Min(1280, $b.Width); $tall = [Math]::Min(800, $b.Height)
                    [void][OracleWin]::ShowWindow($h, 9)   # SW_RESTORE: a maximized window ignores the size
                    # SWP_NOZORDER | SWP_SHOWWINDOW
                    function Get-Width($hw) { $r = New-Object OracleWin+RECT; [void][OracleWin]::GetWindowRect($hw, [ref]$r); "$($r.Right - $r.Left)x$($r.Bottom - $r.Top)" }
                    [void][OracleWin]::SetWindowPos($h, [IntPtr]::Zero, 0, 0, 640, 480, 0x44)
                    Start-Sleep 3
                    $narrow = Get-Width $h
                    [void][OracleWin]::SetWindowPos($h, [IntPtr]::Zero, 0, 0, $wide, $tall, 0x44)
                    Start-Sleep 3
                    $widened = Get-Width $h
                    "window after shrinking: $narrow (asked 640x480); after widening: $widened (asked ${wide}x$tall)"
                    # The window may keep a minimum size: only the width has to have moved, then reached the target.
                    if ([int]($narrow -split 'x')[0] -gt 640 + 40) { throw "the window did not narrow to 640: $narrow" }
                    if ([int]($widened -split 'x')[0] -lt $wide - 40) { throw "the window did not widen to $wide : $widened" }
                }
                $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
                [Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
                $bmp.Save("$env:WORK\screen-$Name.png")
                # Close it cleanly with WM_CLOSE: taskkill without /F. One message is not
                # always enough: the first can land on Shareaza's hidden 'Shareaza Remote'
                # window, which is what Windows reports as its main window. So repeat it.
                $exited = $false
                foreach ($attempt in 1..6) {
                    & taskkill.exe /IM Shareaza.exe 2>&1 | ForEach-Object { "taskkill $attempt`: $_" }
                    foreach ($i in 1..6) { Start-Sleep 5; if (-not (Get-Process -Name Shareaza -ErrorAction SilentlyContinue)) { $exited = $true; break } }
                    if ($exited) { "closed by taskkill, attempt $attempt"; break }
                }
                if (-not $exited) { Stop-Process -Name Shareaza -Force; Start-Sleep 5; throw 'Shareaza did not exit after six WM_CLOSE attempts' }
                '@ | Set-Content -Encoding ASCII run-client.ps1

        -   name: Prepare as a leaf with the kit
            run: |
                $ErrorActionPreference = 'Stop'
                & "$env:KIT\Prepare-Oracle.ps1" -CacheUrl 'http://127.0.0.1:8080/gwc/' -Mode Leaf -Port 6346 -PreferIPv4 -WorkDir $env:WORK

        -   name: Run 1, as a leaf
            timeout-minutes: 10
            run: .\run-client.ps1 -Name leaf

        -   name: Prepare again, as a hub, with the kit
            run: |
                $ErrorActionPreference = 'Stop'
                & "$env:KIT\Prepare-Oracle.ps1" -CacheUrl 'http://127.0.0.1:8080/gwc/' -Mode Hub -Port 6347 -WorkDir $env:WORK
                if (-not (Get-ChildItem "$env:WORK\runs" -Directory)) { throw 'the first run was not moved aside' }

        -   name: Run 2, as a hub
            timeout-minutes: 10
            run: .\run-client.ps1 -Name hub

        -   name: Run 3, with IPv6 on
            # Only builds that know the setting. Restore-Oracle.ps1 removes it with the rest.
            if: env.HAS_IPV6_SETTING == '1'
            timeout-minutes: 10
            run: |
                $ErrorActionPreference = 'Stop'
                New-ItemProperty -Path 'HKCU:\Software\Shareaza\Shareaza\Connection' -Name EnableIPv6 -Value 1 -PropertyType DWord -Force | Out-Null
                .\run-client.ps1 -Name ipv6 -ExpectIPv6

        -   name: Run with incoming traffic blocked
            # The client only reports a blocked firewall: with the rules off, its log must say so.
            # Only builds with the installer's rule have the notice.
            if: env.FIREWALL_RULE == '1'
            timeout-minutes: 10
            run: |
                $ErrorActionPreference = 'Stop'
                $app = (Get-ItemProperty 'HKCU:\Software\Shareaza\Shareaza').Path
                $exe = "$app\Shareaza.exe"
                $log = "$env:APPDATA\Shareaza\Data\Shareaza.log"
                # The kit's rules, and the installer's own, which is for this program only.
                $rules = @(Get-NetFirewallRule -DisplayName 'Shareaza oracle *' -ErrorAction SilentlyContinue) +
                    @(Get-NetFirewallRule -DisplayName 'Shareaza' -ErrorAction SilentlyContinue |
                        Where-Object { "$($_.Direction)" -eq 'Inbound' -and ($_ | Get-NetFirewallApplicationFilter).Program -eq $exe })
                $rules | ForEach-Object { "rule '$($_.DisplayName)': $($_.Direction) $($_.Action), enabled $($_.Enabled)" }
                if (-not ($rules | Where-Object { $_.DisplayName -like 'Shareaza oracle *' })) { throw 'the kit made no firewall rule to disable' }
                if (-not ($rules | Where-Object { $_.DisplayName -eq 'Shareaza' })) { throw "no firewall rule 'Shareaza' to disable" }
                # Shareaza opens its log exclusively for each message, so a read can collide with
                # a write: skip that round. Only what this run adds counts. The log is UTF-16 LE.
                $offset = if (Test-Path $log) { (Get-Item $log).Length - ((Get-Item $log).Length % 2) } else { 0L }
                function Read-NewLog {
                    if (-not (Test-Path $log)) { return '' }
                    try { $fs = [IO.File]::Open($log, [IO.FileMode]::Open, [IO.FileAccess]::Read, [IO.FileShare]'ReadWrite, Delete') } catch [IO.IOException] { return '' }
                    try {
                        $from = if ($fs.Length -lt $offset) { 0L } else { $offset }
                        $count = [int][Math]::Min($fs.Length - $from, 64MB)
                        $count -= $count % 2
                        if ($count -le 0) { return '' }
                        $buffer = New-Object byte[] $count
                        [void]$fs.Seek($from, [IO.SeekOrigin]::Begin)
                        $read = $fs.Read($buffer, 0, $count)
                        return [Text.Encoding]::Unicode.GetString($buffer, 0, $read - ($read % 2))
                    } finally { $fs.Dispose() }
                }
                # With the firewall off on the active profile, or a default of Allow, no notice can come, and a
                # runner property must not fail the gate: record the profile, set it to block inbound for the
                # run, and put the recorded values back in the finally below.
                $before = Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction, AllowInboundRules
                'firewall profiles before:'; $before | Format-Table | Out-String | Write-Host
                $profiles = @(Get-NetConnectionProfile)
                $profiles | ForEach-Object { "connection profile: $($_.Name), $($_.NetworkCategory), $($_.InterfaceAlias)" }
                $names = @($profiles | ForEach-Object { "$($_.NetworkCategory)" -replace '^DomainAuthenticated$', 'Domain' } | Sort-Object -Unique)
                if (-not $names) { throw 'no active network profile to set the firewall of' }
                $saved = @($before | Where-Object { $names -contains "$($_.Name)" })
                if (-not $saved) { throw "no firewall profile named like the active network profile: $($names -join ', ')" }
                try {
                    Set-NetFirewallProfile -Name $saved.Name -Enabled True -DefaultInboundAction Block
                    'firewall profiles during the run:'; Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction, AllowInboundRules | Format-Table | Out-String | Write-Host
                    $rules | Disable-NetFirewallRule
                    Start-Process -FilePath explorer.exe -ArgumentList "`"$exe`""
                    foreach ($i in 1..15) { if (Get-Process -Name Shareaza -ErrorAction SilentlyContinue) { break }; Start-Sleep 2 }
                    if (-not (Get-Process -Name Shareaza -ErrorAction SilentlyContinue)) {
                        '::warning::explorer.exe did not start Shareaza on this runner; starting it directly, elevated'
                        Start-Process -FilePath $exe -WorkingDirectory $app
                    }
                    # Until the log shows the network started, or three minutes pass.
                    $text = ''
                    foreach ($i in 1..36) { $text = Read-NewLog; if ($text.Contains('Starting Shareaza network core')) { break }; Start-Sleep 5 }
                    if (-not $text.Contains('Starting Shareaza network core')) { throw 'the log never showed the network starting within three minutes' }
                    'the network started'
                    # The check runs on the network thread once the listeners are up: allow it a minute.
                    foreach ($i in 1..12) { $text = Read-NewLog; if ($text.Contains('Windows Firewall')) { break }; Start-Sleep 5 }
                    $notice = @($text -split "`r?`n" | Where-Object { $_ -match 'Windows Firewall' })
                    $notice | ForEach-Object { "log: $_" }
                    $notice | Set-Content -Encoding UTF8 "$env:WORK\blocked-notice.txt"
                    if (-not ($notice | Where-Object { $_ -match 'Windows Firewall blocks incoming' })) { throw "the log has no 'Windows Firewall blocks incoming' line with the rules disabled" }
                    'the client reported the blocked firewall'
                    # Close it cleanly with WM_CLOSE, as run-client.ps1 does.
                    $exited = $false
                    foreach ($attempt in 1..6) {
                        & taskkill.exe /IM Shareaza.exe 2>&1 | ForEach-Object { "taskkill $attempt`: $_" }
                        foreach ($i in 1..6) { Start-Sleep 5; if (-not (Get-Process -Name Shareaza -ErrorAction SilentlyContinue)) { $exited = $true; break } }
                        if ($exited) { "closed by taskkill, attempt $attempt"; break }
                    }
                    if (-not $exited) { throw 'Shareaza did not exit after six WM_CLOSE attempts' }
                } finally {
                    # Whatever happened: the rules come back, and no client is left running.
                    if (Get-Process -Name Shareaza -ErrorAction SilentlyContinue) { Stop-Process -Name Shareaza -Force; Start-Sleep 5 }
                    $rules | Enable-NetFirewallRule
                    $rules | ForEach-Object { "re-enabled '$($_.DisplayName)'" }
                    foreach ($f in $saved) {
                        Set-NetFirewallProfile -Name $f.Name -Enabled "$($f.Enabled)" -DefaultInboundAction "$($f.DefaultInboundAction)"
                    }
                    'firewall profiles restored:'; Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction, AllowInboundRules | Format-Table | Out-String | Write-Host
                }

        -   name: Run 4, with a right-to-left layout on a fresh bar layout
            # The client saves its bar layout on exit; without one it places the bars by default.
            # Restore-Oracle.ps1 removes the whole settings key, so this setting does not outlive the run.
            timeout-minutes: 10
            run: |
                $ErrorActionPreference = 'Stop'
                $k = 'HKCU:\Software\Shareaza\Shareaza'
                Get-ChildItem "$k\Toolbars" -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -like 'CoolBar-*' } | Remove-Item -Recurse
                # The client reads LanguageRTL from its Settings section (Settings.cpp), and writes it back on exit.
                New-Item -Path "$k\Settings" -Force | Out-Null
                New-ItemProperty -Path "$k\Settings" -Name LanguageRTL -Value 1 -PropertyType DWord -Force | Out-Null
                try {
                    # IPv6 is still on from run 3, on builds that have the setting.
                    .\run-client.ps1 -Name rtl -ExpectIPv6 -ExpectRTL
                } finally {
                    Remove-ItemProperty -Path "$k\Settings" -Name LanguageRTL -ErrorAction SilentlyContinue
                }

        -   name: Run with the window resized
            timeout-minutes: 10
            run: |
                $ErrorActionPreference = 'Stop'
                $k = 'HKCU:\Software\Shareaza\Shareaza'
                Get-ChildItem "$k\Toolbars" -ErrorAction SilentlyContinue | Where-Object { $_.PSChildName -like 'CoolBar-*' } | Remove-Item -Recurse
                Remove-ItemProperty -Path "$k\Settings" -Name LanguageRTL -ErrorAction SilentlyContinue   # the client wrote it back on exit
                .\run-client.ps1 -Name resize -ExpectIPv6 -Resize

        -   name: Prepare must refuse while a restore is unfinished
            run: |
                $marker = "$env:WORK\session\restoring"
                Set-Content $marker 'test'
                $ErrorActionPreference = 'Continue'
                $out = & powershell -NoProfile -File "$env:KIT\Prepare-Oracle.ps1" -CacheUrl 'http://127.0.0.1:8080/gwc/' -WorkDir $env:WORK 2>&1 | Out-String
                $code = $LASTEXITCODE
                Remove-Item $marker
                if ($code -eq 0 -or $out -notmatch 'did not finish') { Write-Host "::error::Prepare did not refuse during a restore: $out"; exit 1 }
                exit 0

        -   name: Collect and restore with the kit
            if: always()
            run: |
                $ErrorActionPreference = 'Stop'
                if (Get-Process -Name Shareaza -ErrorAction SilentlyContinue) { Stop-Process -Name Shareaza -Force; Start-Sleep 5 }
                if (Test-Path "$env:WORK\session\manifest.json") {
                    & "$env:KIT\Restore-Oracle.ps1" -WorkDir $env:WORK
                } else {
                    # Nothing was saved, so nothing to restore (an earlier step failed first).
                    & "$env:KIT\Restore-Oracle.ps1" -CollectOnly -WorkDir $env:WORK
                    throw 'no saved setup to restore: an earlier step failed before the backup'
                }

        -   name: Check what the client did and what the kit restored
            env:
                EXPECT: ${{ matrix.expect }}
                AGENT: ${{ matrix.agent }}
            run: |
                $ErrorActionPreference = 'Stop'
                function Fail($m) { Write-Host "::error::$m"; exit 1 }
                $env:EXPECT = $env:EXPECT.Replace('{version}', "$env:CLIENT_VERSION")
                $env:AGENT = $env:AGENT.Replace('{version}', "$env:CLIENT_VERSION")
                "expecting $env:EXPECT from $env:AGENT"
                if (-not (Test-Path gwc-requests.jsonl)) { Fail 'Shareaza never queried the stub cache' }
                $req = @(Get-Content gwc-requests.jsonl | Where-Object { $_ -match '"/gwc/\?' })
                if ($req.Count -lt 2) { Fail "expected two or more queries in all, got $($req.Count)" }
                if (-not ($req | Select-String -SimpleMatch $env:EXPECT)) { Fail "no request carried $env:EXPECT" }
                if (-not ($req | Select-String -SimpleMatch "`"user_agent`": `"$env:AGENT`"")) { Fail "no request came from $env:AGENT" }

                $zip = Get-ChildItem "$env:WORK\evidence-*.zip" | Select-Object -First 1
                if (-not $zip) { Fail 'no evidence zip' }
                $ev = "$env:WORK\ev"; Expand-Archive $zip.FullName $ev
                foreach ($f in 'Shareaza.log', 'Discovery.dat', 'HostCache.dat', 'shareaza.reg') {
                    if (-not (Test-Path "$ev\$f")) { Fail "the evidence lacks $f" }
                }
                $log = Get-Content -Encoding Unicode "$ev\Shareaza.log"
                if (-not ($log | Select-String -SimpleMatch '[DiscoveryServices] Request:')) { Fail 'the log has no debug-level discovery lines' }
                $other = $log | Select-String -SimpleMatch 'Querying discovery service' | Where-Object { $_ -notmatch '"http://127\.0\.0\.1:8080/gwc/"' }
                if ($other) { Fail "queried another discovery service: $other" }
                if ($log | Select-String -SimpleMatch '[VersionChecker] Request') { Fail 'the client still checked for updates' }
                if ($log | Select-String -SimpleMatch 'Failed to load security rules') { Fail 'the client ran without security rules' }
                if (-not ($log | Select-String -SimpleMatch 'port 6347.')) { Fail 'the last run did not listen on the prepared port 6347' }
                if ($log | Select-String -SimpleMatch 'MyTorrents') { Fail 'the client touched the private torrent folder' }
                $reg = Get-Content "$ev\shareaza.reg"
                $settings = ($reg -join "`n") -split '(?=\[HKEY)' | Where-Object { $_ -match '\\Shareaza\\Settings\]' }
                if ($settings -notmatch '"Running"=dword:00000000') { Fail 'the last run did not finish with a clean exit save' }

                # Nothing but hidden folder files was ever in the shared folders.
                $leaked = @(Get-ChildItem -File -Recurse "$env:WORK\runs" -ErrorAction SilentlyContinue |
                    Where-Object { $_.FullName -match '\\shared\\' -and -not ($_.Attributes -band [IO.FileAttributes]::Hidden) })
                if ($leaked) { Fail "files were in the shared folders: $($leaked.FullName -join ', ')" }

                # Restored: the planted setup is back, the oracle's settings and rules are gone.
                $k = 'HKCU:\Software\Shareaza\Shareaza'
                if ((Get-ItemProperty $k).OracleMarker -ne 'mine') { Fail 'the planted registry value was not restored' }
                if ((Get-ItemProperty "$k\Downloads").TorrentPath -ne "$env:USERPROFILE\MyTorrents") { Fail 'the planted TorrentPath was not restored' }
                if ((Get-ItemProperty "$k\Connection").RandomPort -ne 1) { Fail 'the planted RandomPort was not restored' }
                if ((Get-ItemProperty $k).PSObject.Properties['DebugLog']) { Fail 'oracle settings were left behind' }
                if ((Get-Content "$env:APPDATA\Shareaza\Data\marker.txt" -ErrorAction SilentlyContinue) -ne 'mine') { Fail 'the planted data folder was not restored' }
                if ((Get-Content "$env:USERPROFILE\MyTorrents\secret.torrent") -ne 'private') { Fail 'the private torrent folder changed' }
                $app = Join-Path $env:ProgramFiles 'Shareaza'
                if ((Get-FileHash "$app\Data\DefaultServices.dat").Hash -ne (Get-Content stock-defaults.sha256)) { Fail 'DefaultServices.dat was not restored' }
                if (Get-NetFirewallRule -DisplayName 'Shareaza oracle *' -ErrorAction SilentlyContinue) { Fail 'firewall rules were left behind' }
                $policy = @((& netsh interface ipv6 show prefixpolicies) -match '::ffff:0:0/96')
                if ($policy.Count -ne 1) { Fail "no ::ffff:0:0/96 prefix policy row: $policy" }
                if ($policy[0] -notmatch '^\s*35\s+4\s') { Fail "IPv4 preference not restored: $($policy[0])" }
                if (Test-Path "$env:WORK\session") { Fail 'the saved setup was not removed after restoring' }

                # A second restore must refuse, not touch the restored setup.
                # Its refusal goes to stderr, which 'Stop' would turn into an error here.
                $ErrorActionPreference = 'Continue'
                $out = & powershell -NoProfile -File "$env:KIT\Restore-Oracle.ps1" -WorkDir $env:WORK 2>&1 | Out-String
                $code = $LASTEXITCODE
                $ErrorActionPreference = 'Stop'
                if ($code -eq 0) { Fail "a second Restore-Oracle.ps1 did not refuse: $out" }
                if ($out -notmatch 'nothing to restore') { Fail "a second Restore-Oracle.ps1 failed for another reason: $out" }
                if ((Get-ItemProperty $k).OracleMarker -ne 'mine') { Fail 'the second restore damaged the setup' }
                # The client only checks the firewall now: the runs must not have added rules.
                if ($env:FIREWALL_RULE -eq '1') { .\check-firewall.ps1 -Program "$app\Shareaza.exe" }
                Write-Host 'All checks passed.'
                # The refused restore above left $LASTEXITCODE at 1, which the step would report.
                exit 0

        -   name: Uninstall and check the firewall rule is gone
            # Last, because uninstalling deletes the settings and data the kit restored.
            if: env.FIREWALL_RULE == '1'
            timeout-minutes: 10
            run: |
                $ErrorActionPreference = 'Stop'
                $app = Join-Path $env:ProgramFiles 'Shareaza'
                $p = Start-Process -FilePath "$app\Uninstall\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
                if ($p.ExitCode -ne 0) { throw "the uninstaller exited with $($p.ExitCode)" }
                # unins000.exe hands over to a copy of itself in %TEMP%: wait for that to finish too.
                foreach ($i in 1..60) { if (-not (Test-Path "$app\Shareaza.exe")) { break }; Start-Sleep 2 }
                if (Test-Path "$app\Shareaza.exe") { throw 'Shareaza.exe is still installed after uninstalling' }
                .\check-firewall.ps1 -Program "$app\Shareaza.exe" -Absent
                # Under any name: a rule made by another installer or a prompt must go too. The kit's
                # own rules are already gone, and are excluded in case one is left.
                $left = @(Get-NetFirewallApplicationFilter |
                    Where-Object { [Environment]::ExpandEnvironmentVariables("$($_.Program)") -ieq "$app\Shareaza.exe" } |
                    Get-NetFirewallRule |
                    Where-Object { "$($_.Direction)" -eq 'Inbound' -and $_.DisplayName -notlike 'Shareaza oracle*' })
                $left | ForEach-Object { "rule '$($_.DisplayName)' still allows or blocks Shareaza.exe" }
                if ($left) { throw "$($left.Count) inbound firewall rule(s) for $app\Shareaza.exe remain under another name" }
                "no inbound firewall rule of any name for $app\Shareaza.exe"

        -   name: Gather the evidence into the workspace
            # upload-artifact takes files from under the workspace only.
            if: always()
            run: |
                New-Item -ItemType Directory -Force evidence | Out-Null
                foreach ($p in "$env:WORK\evidence-*.zip", "$env:WORK\install-*.log", "$env:WORK\screen-*.png", "$env:WORK\blocked-notice.txt", 'gwc-requests.jsonl') {
                    Copy-Item $p evidence -ErrorAction SilentlyContinue
                }
                # Which profile Windows gave the runner's network: Public blocks what Private allows.
                # After the copy, so that an error here cannot skip it.
                Get-NetConnectionProfile -ErrorAction Continue | Format-List * | Out-File -Encoding UTF8 evidence\network-profile.txt
                Get-Content evidence\network-profile.txt -ErrorAction Continue
                Get-NetFirewallProfile -ErrorAction Continue | Select-Object Name, Enabled, DefaultInboundAction, AllowInboundRules | Format-Table | Out-File -Encoding UTF8 evidence\firewall-profiles.txt

        -   name: Upload the evidence
            if: always()
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
                name: oracle-windows-${{ matrix.client }}
                path: evidence/
                if-no-files-found: warn
