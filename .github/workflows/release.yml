name: Build and release

on:
    workflow_dispatch:
    push:
      tags:
        - v*.*.*

env:
    # Path to the solution file relative to the root of the project.
    SOLUTION_FILE_PATH: vc143/Shareaza.sln
    RELEASEBUILD_FILE_PATH: vc143/ReleaseBuild.props

permissions:
    contents: read

jobs:
    workflow_matrix:
        # windows-latest and windows-2025 are Visual Studio 2026 images: they carry
        # the v143 compiler but not the v143 ATL/MFC libraries this solution needs.
        runs-on: windows-2022
        strategy:
            # Let the other platform finish when one fails, so a run always says
            # which legs are broken rather than only the first one.
            fail-fast: false
            matrix:
                platform: [ Win32, x64 ]
                type: [ Release ]
        steps:
        -   name: Checkout GIT sources
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
                fetch-depth: 0

        -   name: Install GitVersion
            uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0
            with:
                versionSpec: '6.8.2'

        -   name: Add MSBuild to PATH
            uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3.0.0

        -   name: Install Inno Setup 6.7.3
            # setup/Installer_143.vcxproj calls ISCC by a fixed path, under "Inno Setup 6".
            # The runner image ships whatever 6.x it was built with, so the build installs
            # the last 6.x release over it, from the official release, hash-pinned.
            # Moving to 7.x would be a change of its own.
            shell: pwsh
            run: |
                $version = '6.7.3'
                $url = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe'
                $sha256 = '9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732'
                $dir = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6'
                $exe = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
                $log = Join-Path $env:RUNNER_TEMP "innosetup-$version.log"
                Invoke-WebRequest -Uri $url -OutFile $exe
                $actual = (Get-FileHash -Path $exe -Algorithm SHA256).Hash
                if ($actual -ne $sha256) { throw "innosetup-$version.exe hash $actual does not match $sha256" }
                $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/ALLUSERS', "/DIR=`"$dir`"", "/LOG=`"$log`""
                if ($p.ExitCode -ne 0) { throw "Inno Setup installer exited with $($p.ExitCode)" }
                if (-not (Select-String -Path $log -SimpleMatch 'Installation process succeeded.' -Quiet)) { Get-Content $log -Tail 40; throw "Inno Setup $version did not install" }
                # The hash pins what ran; this checks what is installed now. ISCC.exe's own
                # version fields read 0.0.0.0, so only the uninstall key carries the version.
                $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\Inno Setup 6_is1'
                $installed = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).DisplayVersion
                Write-Output "Inno Setup in $dir reports $installed"
                if ($installed -ne $version) { throw "Inno Setup reports $installed, not $version" }
                if (-not (Test-Path (Join-Path $dir 'ISCC.exe'))) { throw "ISCC.exe is not in $dir" }

        -   name: Restore NuGet packages (Shareaza)
            working-directory: ${{env.GITHUB_WORKSPACE}}
            run: nuget restore ${{env.SOLUTION_FILE_PATH}}

        -   name: Determine Version
            id:   gitversion
            uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4.7.0

        -   name: Build
            working-directory: ${{env.GITHUB_WORKSPACE}}
            # VS 2022 17.8+ deprecates stdext::make_checked_array_iterator (STL4043),
            # which SDLCheck turns into error C4996 in shareaza/BTInfo.cpp. cl.exe
            # appends CL to every compile, so this opts out without a source change.
            env:
                CL: /D_SILENCE_STDEXT_ARR_ITERS_DEPRECATION_WARNING
            # Add additional options to the MSBuild command line here (like platform or verbosity level).
            # See https://docs.microsoft.com/visualstudio/msbuild/msbuild-command-line-reference
            run: msbuild ${{env.SOLUTION_FILE_PATH}} /nologo /v:m /t:Rebuild /p:ForceImportBeforeCppTargets=${{env.RELEASEBUILD_FILE_PATH}} /p:Configuration=${{ matrix.type }} /p:Platform=${{ matrix.platform }} /p:DefineConstants=BUILDFROMMSBUILD /p:RevisionSHA=${{ steps.gitversion.outputs.shortSha }} /p:RevisionDate=${{ steps.gitversion.outputs.commitDate }} /fl /flp:Summary

        -   name: Compute SHA-256 manifest
            shell: bash
            working-directory: setup/builds
            run: |
                sha256sum -- *.exe | tee SHA256SUMS.txt

        -   name: Archive Shareaza Release
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
                name: Shareaza Windows ${{ matrix.platform }} ${{ matrix.type }}
                path: |
                    setup/builds/*.exe
                    setup/builds/SHA256SUMS.txt
                if-no-files-found: error

    publish:
        needs: workflow_matrix
        # Only a tag push publishes. A workflow_dispatch run stops at the artifacts,
        # even when it is dispatched against a tag.
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        defaults:
            run:
                # bash, not the default bash -e: adds pipefail.
                shell: bash
        env:
            # Secrets cannot be referenced in a step's if:. Expose only whether the
            # key is set, so the key itself reaches the VirusTotal step alone.
            HAS_VT_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY != '' }}
        steps:
        - name: Download All Artifacts
          uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
          with:
            path: artifacts
        - name: Display structure of downloaded files
          run: ls -R artifacts
        - name: Verify and merge SHA-256 manifests
          # Each build job hashed its own installer; check those hashes survived the
          # artifact round trip, then write one manifest for the release.
          run: |
            for d in artifacts/*/; do (cd "$d" && sha256sum -c SHA256SUMS.txt); done
            mkdir dist
            cp artifacts/*/*.exe dist/
            # Two artifacts with the same installer name would overwrite each other.
            src=(artifacts/*/*.exe) dst=(dist/*.exe)
            [ "${#src[@]}" -eq "${#dst[@]}" ] || { echo "::error::duplicate installer names"; exit 1; }
            (cd dist && sha256sum -- *.exe | tee SHA256SUMS.txt)
        - name: VirusTotal Scan
          id: virustotal
          if: env.HAS_VT_KEY == 'true'
          uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
          with:
            vt_api_key: ${{ secrets.VIRUS_TOTAL_API_KEY }}
            files: |
              dist/*.exe
        - name: Write release body
          # The action only edits a release body on a release event, so the
          # analysis links are written into the body here instead.
          env:
            ANALYSIS: ${{ steps.virustotal.outputs.analysis }}
          run: |
            if [ "$HAS_VT_KEY" = true ] && [ -z "$ANALYSIS" ]; then
              echo "::error::VirusTotal ran but produced no analysis output"; exit 1
            fi
            : > body.md
            if [ -n "$ANALYSIS" ]; then
              echo "🛡 VirusTotal analysis:" >> body.md
              # Entries are file=url. Split on the first '=' only: analysis ids are
              # base64 and can end in '='.
              echo "$ANALYSIS" | tr ',' '\n' | while read -r entry; do
                [ -n "$entry" ] || continue
                echo "* [\`$(basename "${entry%%=*}")\`](${entry#*=})" >> body.md
              done
            fi
            cat body.md
        - name: Release
          uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
          with:
            draft: true
            make_latest: true
            generate_release_notes: true
            body_path: body.md
            fail_on_unmatched_files: true
            files: |
              dist/*.exe
              dist/SHA256SUMS.txt
