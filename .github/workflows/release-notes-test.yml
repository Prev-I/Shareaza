name: Release notes test

on:
    pull_request:
      paths:
        - shareaza/ReleaseNotes.h
        - tests/release-notes/**
        - .github/workflows/release-notes-test.yml
    push:
      branches:
        - main
      paths:
        - shareaza/ReleaseNotes.h
        - tests/release-notes/**
        - .github/workflows/release-notes-test.yml

permissions:
    contents: read

jobs:
    release_notes:
        runs-on: ubuntu-latest
        steps:
        -   name: Checkout GIT sources
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        -   name: Build and run the release-notes test
            run: g++ -std=c++17 -Wall -Wextra -I shareaza -o /tmp/rn tests/release-notes/test_release_notes.cpp && /tmp/rn
