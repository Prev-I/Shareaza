name: Oracle under Wine

# Checks the steps in docs/ORACLE.md end to end on a Linux runner: install the
# official 2.7.10.2 and this fork's x64 build into their own Wine prefixes,
# start each one against a local stub GWebCache, and record what it sends.
# Nothing here contacts the live G2 network: DefaultServices.dat is replaced so
# the only discovery service either client knows is the stub.

on:
    workflow_dispatch:
      inputs:
        release_run_id:
          description: 'Run id of a "Build and release" tag run to take the fork installer from (default: latest successful one)'
          required: false
    pull_request:
      paths:
        - docs/ORACLE.md
        - .github/workflows/oracle-wine.yml

permissions:
    contents: read
    actions: read

jobs:
    oracle:
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                include:
                  - client: sf
                    expect: client=RAZA2.7.10.2
                  - client: previ
                    expect: client=RAZI2.7.10.6
        env:
            WINEPREFIX: /home/runner/.wine-shareaza-${{ matrix.client }}
            WINEARCH: win64
            WINEDEBUG: -all
            DISPLAY: ':99'
            SF_URL: https://downloads.sourceforge.net/project/shareaza/Shareaza/Shareaza-2.7.10.2/Shareaza_2.7.10.2_x64.exe
            # Published by SourceForge for Shareaza_2.7.10.2_x64.exe.
            SF_SHA256: d6ff141d69a3af53f8f7547b40e308a4e2aa4818eeb28da827d7545165ef3051
        defaults:
            run:
                shell: bash
        steps:
        -   name: Install Wine, winetricks and X tools
            run: |
                sudo dpkg --add-architecture i386
                sudo apt-get update -q
                sudo apt-get install -y -q --no-install-recommends wine wine64 wine32:i386 winetricks cabextract xvfb x11-apps imagemagick
                wine --version | tee wine-version.txt
                winetricks --version | tee -a wine-version.txt

        -   name: Fetch the official 2.7.10.2 installer
            if: matrix.client == 'sf'
            run: |
                mkdir -p installer
                curl -sSfL -o installer/setup.exe "$SF_URL"
                echo "$SF_SHA256  installer/setup.exe" | sha256sum -c

        -   name: Find the fork's release build
            if: matrix.client == 'previ'
            id: release
            env:
                GH_TOKEN: ${{ github.token }}
                RUN_ID: ${{ inputs.release_run_id }}
            run: |
                if [ -z "$RUN_ID" ]; then
                  RUN_ID=$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --event push --status success -L 1 --json databaseId --jq '.[0].databaseId')
                fi
                [ -n "$RUN_ID" ] || { echo "::error::no successful tag build of release.yml"; exit 1; }
                echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

        -   name: Fetch the fork's x64 installer
            if: matrix.client == 'previ'
            uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
            with:
                name: Shareaza Windows x64 Release
                run-id: ${{ steps.release.outputs.run_id }}
                github-token: ${{ github.token }}
                path: installer

        -   name: Verify the fork's installer against its manifest
            if: matrix.client == 'previ'
            working-directory: installer
            run: |
                sha256sum -c SHA256SUMS.txt
                mv -- *.exe setup.exe

        -   name: Start a virtual display
            run: |
                Xvfb :99 -screen 0 1280x800x24 &
                sleep 3

        -   name: Create the prefix and install the VC++ 2022 runtime
            run: |
                wineboot --init
                wineserver --wait
                winetricks -q vcrun2022
                wineserver --wait

        -   name: Install Shareaza silently
            run: |
                wine installer/setup.exe /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /LOG="C:\\shareaza-setup.log"
                wineserver --wait
                cp "$WINEPREFIX/drive_c/shareaza-setup.log" setup.log
                tail -5 setup.log
                grep -q 'Installation process succeeded' setup.log
                ls "$WINEPREFIX/drive_c/Program Files/Shareaza/Shareaza.exe"

        -   name: Point discovery at a local stub cache only
            run: |
                # DefaultServices.dat is read from the install folder on first run,
                # when no Discovery.dat exists yet. Format: "<type> <url>", 2 = G2 GWC.
                printf '2 http://127.0.0.1:8080/gwc/\r\n' > "$WINEPREFIX/drive_c/Program Files/Shareaza/Data/DefaultServices.dat"
                # Settings live in the registry, not a file.
                k='HKCU\Software\Shareaza\Shareaza'
                # Windows\RunWizard, not Settings\FirstRun, keeps the QuickStart wizard away
                # (WndMain.cpp); RunWarnings skips the warnings dialog that follows it.
                wine reg add "$k\Windows" /v RunWizard /t REG_DWORD /d 1 /f
                wine reg add "$k\Windows" /v RunWarnings /t REG_DWORD /d 1 /f
                # Exit on close instead of asking, so taskkill shuts it down cleanly.
                wine reg add "$k\Settings" /v CloseMode /t REG_DWORD /d 1 /f
                # 2.7.10.2 checks shareaza.sourceforge.net for updates on start by default.
                wine reg add "$k\VersionCheck" /v UpdateCheck /t REG_DWORD /d 0 /f
                wine reg add "$k" /v DebugLog /t REG_DWORD /d 1 /f
                wine reg add "$k" /v LogLevel /t REG_DWORD /d 4 /f
                # G1, eD2k and DC are off by default; BitTorrent, its DHT and UPnP are
                # on and would reach the live internet on their own.
                wine reg add "$k\BitTorrent" /v EnableAlways /t REG_DWORD /d 0 /f
                wine reg add "$k\BitTorrent" /v EnableDHT /t REG_DWORD /d 0 /f
                wine reg add "$k\Connection" /v EnableUPnP /t REG_DWORD /d 0 /f
                wineserver --wait

        -   name: Run Shareaza against the stub cache
            run: |
                cat > stub.py <<'EOF'
                import http.server, json, sys, time
                class H(http.server.BaseHTTPRequestHandler):
                    def do_GET(self):
                        with open('gwc-requests.jsonl', 'a') as f:
                            f.write(json.dumps({'t': time.time(), 'path': self.path,
                                                'user_agent': self.headers.get('User-Agent')}) + '\n')
                        body = b'I|pong|oracle-stub 0.1|gnutella2\n'
                        self.send_response(200)
                        self.send_header('Content-Type', 'text/plain')
                        self.send_header('Content-Length', str(len(body)))
                        self.end_headers()
                        self.wfile.write(body)
                    def log_message(self, *a):
                        pass
                http.server.ThreadingHTTPServer(('127.0.0.1', 8080), H).serve_forever()
                EOF
                python3 -I stub.py &
                STUB=$!
                wine "C:\\Program Files\\Shareaza\\Shareaza.exe" &
                for _ in $(seq 1 36); do
                  sleep 5
                  [ -s gwc-requests.jsonl ] && break
                done
                sleep 20
                import -window root screenshot-running.png || true
                # taskkill without /F posts WM_CLOSE, so Shareaza shuts down and saves its data.
                wine taskkill /IM Shareaza.exe || true
                for _ in $(seq 1 24); do
                  sleep 5
                  pgrep -f 'Shareaza.exe' >/dev/null || break
                done
                import -window root screenshot-closing.png || true
                wineserver -k || true
                kill "$STUB" || true
                cat gwc-requests.jsonl || true

        -   name: Collect what the client left behind
            run: |
                mkdir -p out
                user_data="$WINEPREFIX/drive_c/users/$USER/AppData/Roaming/Shareaza"
                find "$WINEPREFIX/drive_c" \( -name 'Discovery.dat' -o -name 'HostCache.dat' -o -name 'Shareaza.log' \) -printf '%s\t%p\n' | sed "s|$WINEPREFIX|\$WINEPREFIX|" | tee out/data-files.txt
                cp "$user_data/Data/Shareaza.log" out/ 2>/dev/null || true
                wine reg export 'HKCU\Software\Shareaza' out/shareaza.reg /y || true
                wineserver --wait
                cp gwc-requests.jsonl setup.log wine-version.txt screenshot-*.png out/ 2>/dev/null || true

        -   name: Check the client string the cache saw
            env:
                EXPECT: ${{ matrix.expect }}
            run: |
                [ -s out/gwc-requests.jsonl ] || { echo "::error::Shareaza never queried the stub cache"; exit 1; }
                grep -F -- "$EXPECT" out/gwc-requests.jsonl || { echo "::error::no request carried $EXPECT"; exit 1; }
                grep -q 'Discovery.dat' out/data-files.txt || { echo "::error::Discovery.dat was not written"; exit 1; }
                # The log is UTF-16; it must show no update check once UpdateCheck is off.
                if iconv -f UTF-16 -t UTF-8 out/Shareaza.log | grep -q 'VersionChecker\] Request'; then
                  echo "::error::the client still checked for updates"; exit 1
                fi

        -   name: Upload the evidence
            if: always()
            uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
            with:
                name: oracle-${{ matrix.client }}
                path: out/
                if-no-files-found: warn
